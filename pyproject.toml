[project]
name = "arq-website"
version = "0.1.0"
description = "ARQ company website"
requires-python = ">=3.11"

dependencies = [
    "fastapi~=0.162.0",
    "uvicorn[standard]~=0.54.0",
    "sqlalchemy~=2.1.8",
    "jinja2~=3.1.6",
    "python-dotenv~=1.2.4",
    "pytest~=9.2.0",
    # passlib[argon2]
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# РЕШЕНИЕ КОНФЛИКТА app/alembic:
[tool.setuptools]
# Вариант А: Просто укажи явно пакет app
packages = ["app"]

# Вариант Б: Или используй поиск с исключением alembic
# [tool.setuptools.packages.find]
# where = ["."]
# include = ["app*"]
# exclude = ["alembic*", "tests*", "scripts*", "*.egg-info"]
